<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qori Silver — Shop (MVP)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">QORI <span>SILVER</span></a>
    <ul class="nav-links">
      <li><a href="shop.html">Shop</a></li>
      <li><a href="index.html#craftsmanship">Craftsmanship</a></li>
      <li><a href="index.html#about">About</a></li>
    </ul>
    <a href="#" class="nav-cart" data-cart-open>Cart (0)</a>
    <button class="nav-toggle" aria-label="Open menu">&#9776;</button>
  </nav>

  <section class="shop-hero">
    <div class="sec-label" style="color:var(--teal-lt)">Collection</div>
    <h1 style="font-size:clamp(2.2rem,4.5vw,3.4rem)">Shop</h1>
    <p class="hero-desc" style="max-width:720px">
      Handcrafted sterling silver from Cusco, Peru. Each piece is made to order.
    </p>
  </section>

  <section class="shop">
    <div class="shop-grid">
      <p style="text-align:center;padding:3rem;opacity:.6;grid-column:1/-1">Loading products…</p>
    </div>
  </section>

  <!-- ── CART DRAWER (MVP) ── -->
  <div class="cart-overlay" data-cart-overlay></div>
  <aside class="cart-drawer" data-cart-drawer aria-label="Cart">
    <div class="cart-head">
      <div class="cart-title">Your Cart <span class="cart-pill" data-cart-count>0</span></div>
      <button class="cart-x" type="button" data-cart-close aria-label="Close cart">×</button>
    </div>
    <div class="cart-body">
      <div class="cart-items" data-cart-items></div>
    </div>
    <div class="cart-foot">
      <div class="cart-row">
        <span class="muted">Subtotal</span>
        <strong data-cart-subtotal>$0.00</strong>
      </div>
      <div class="cart-actions">
        <button class="btn-ghost cart-clear" type="button" data-cart-clear>Clear</button>
        <button class="btn-primary cart-checkout" type="button" data-cart-checkout>Checkout</button>
      </div>
    </div>
  </aside>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
