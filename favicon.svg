<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Qori Silver">
  <defs>
    <!--
      Silver chain link tile.
      Two horizontal oval rings per row — the classic flat-link chain look.
    -->
    <pattern id="cl" x="0" y="0" width="10" height="7" patternUnits="userSpaceOnUse">
      <ellipse cx="2.5" cy="3.5" rx="2.0" ry="1.2" fill="none" stroke="#C4D0D8" stroke-width="0.72"/>
      <ellipse cx="7.5" cy="3.5" rx="2.0" ry="1.2" fill="none" stroke="#C4D0D8" stroke-width="0.72"/>
    </pattern>

    <!-- Peru silhouette — Pacific coast left, Amazon right, north up. -->
    <clipPath id="peru">
      <path d="M 23,13
               Q 27,9   30,11
               Q 33,11  36,12
               Q 38,13  40,15
               L 44,20
               Q 46,25  45,29
               Q 44,34  43,38
               Q 41,43  40,46
               Q 37,49  34,49
               Q 30,51  26,50
               Q 24,49  23,48
               L 20,40  19,31  19,22
               Q 21,17  23,13 Z"/>
    </clipPath>
  </defs>

  <!-- Dark background -->
  <rect width="64" height="64" rx="8" fill="#1A1410"/>

  <!-- Very subtle silver interior base so chain links read clearly -->
  <path d="M 23,13 Q 27,9 30,11 Q 33,11 36,12 Q 38,13 40,15
           L 44,20 Q 46,25 45,29 Q 44,34 43,38 Q 41,43 40,46
           Q 37,49 34,49 Q 30,51 26,50 Q 24,49 23,48
           L 20,40 19,31 19,22 Q 21,17 23,13 Z"
        fill="rgba(196,208,216,0.09)"/>

  <!-- Chain link fill, clipped to Peru map -->
  <rect x="0" y="0" width="64" height="64" fill="url(#cl)" clip-path="url(#peru)"/>

  <!-- Gold Peru outline — drawn last so it's crisp on top of chain -->
  <path d="M 23,13 Q 27,9 30,11 Q 33,11 36,12 Q 38,13 40,15
           L 44,20 Q 46,25 45,29 Q 44,34 43,38 Q 41,43 40,46
           Q 37,49 34,49 Q 30,51 26,50 Q 24,49 23,48
           L 20,40 19,31 19,22 Q 21,17 23,13 Z"
        fill="none" stroke="#C9A84C" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Lima marker — small gold dot on the coast, ~midpoint of Peru -->
  <circle cx="20" cy="32" r="1.3" fill="#C9A84C" opacity="0.85"/>
</svg>
