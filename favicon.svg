<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Qori Silver">

  <!-- Background -->
  <rect width="64" height="64" rx="6" fill="#1A1410"/>

  <!-- LEFT WING — wide solid block, feather cuts -->
  <polygon points="2,12 26,18 26,36 2,32" fill="#E8E2D6"/>
  <line x1="4"  y1="15" x2="26" y2="22" stroke="#1A1410" stroke-width="2.2"/>
  <line x1="4"  y1="21" x2="26" y2="28" stroke="#1A1410" stroke-width="1.8"/>
  <line x1="4"  y1="27" x2="26" y2="33" stroke="#1A1410" stroke-width="1.4"/>

  <!-- RIGHT WING — mirrored -->
  <polygon points="62,12 38,18 38,36 62,32" fill="#E8E2D6"/>
  <line x1="60" y1="15" x2="38" y2="22" stroke="#1A1410" stroke-width="2.2"/>
  <line x1="60" y1="21" x2="38" y2="28" stroke="#1A1410" stroke-width="1.8"/>
  <line x1="60" y1="27" x2="38" y2="33" stroke="#1A1410" stroke-width="1.4"/>

  <!-- BODY — central angular mass -->
  <polygon points="26,18 38,18 42,36 32,40 22,36" fill="#E8E2D6"/>

  <!-- HEAD — angular, upper-right -->
  <polygon points="36,6 44,4 47,11 44,17 36,17 33,10" fill="#E8E2D6"/>

  <!-- Neck bridge -->
  <polygon points="34,16 42,16 40,18 28,18 30,17" fill="#E8E2D6"/>

  <!-- GOLD CHAIN COLLAR -->
  <rect x="33" y="15" width="10" height="4" rx="2" fill="#C9A84C"/>
  <rect x="34.5" y="15.5" width="7" height="2" rx="1" fill="#D9BA5A" opacity="0.5"/>

  <!-- TALONS -->
  <polygon points="26,40 22,46 28,44 32,48 36,44 42,46 38,40" fill="#E8E2D6"/>

  <!-- ── CHAIN LINK CLUSTER ──────────────────────────────────────────
       Replaces Paru's grape cluster. Same triangular formation:
       wide at top (held by talons), tapering to a point at bottom.
       5 → 4 → 3 → 2 → 1 rows of silver oval rings.
       ──────────────────────────────────────────────────────────────── -->

  <!-- Row 1 — 5 links, widest -->
  <ellipse cx="18" cy="51" rx="3.0" ry="1.6" fill="none" stroke="#C4D0D8" stroke-width="1.1"/>
  <ellipse cx="25" cy="51" rx="3.0" ry="1.6" fill="none" stroke="#C4D0D8" stroke-width="1.1"/>
  <ellipse cx="32" cy="51" rx="3.0" ry="1.6" fill="none" stroke="#C4D0D8" stroke-width="1.1"/>
  <ellipse cx="39" cy="51" rx="3.0" ry="1.6" fill="none" stroke="#C4D0D8" stroke-width="1.1"/>
  <ellipse cx="46" cy="51" rx="3.0" ry="1.6" fill="none" stroke="#C4D0D8" stroke-width="1.1"/>

  <!-- Row 2 — 4 links -->
  <ellipse cx="21" cy="55" rx="2.8" ry="1.5" fill="none" stroke="#B8C8D4" stroke-width="1.0"/>
  <ellipse cx="28" cy="55" rx="2.8" ry="1.5" fill="none" stroke="#B8C8D4" stroke-width="1.0"/>
  <ellipse cx="35" cy="55" rx="2.8" ry="1.5" fill="none" stroke="#B8C8D4" stroke-width="1.0"/>
  <ellipse cx="42" cy="55" rx="2.8" ry="1.5" fill="none" stroke="#B8C8D4" stroke-width="1.0"/>

  <!-- Row 3 — 3 links -->
  <ellipse cx="25" cy="58.5" rx="2.5" ry="1.4" fill="none" stroke="#ACBCCA" stroke-width="0.9"/>
  <ellipse cx="32" cy="58.5" rx="2.5" ry="1.4" fill="none" stroke="#ACBCCA" stroke-width="0.9"/>
  <ellipse cx="39" cy="58.5" rx="2.5" ry="1.4" fill="none" stroke="#ACBCCA" stroke-width="0.9"/>

  <!-- Row 4 — 2 links -->
  <ellipse cx="29" cy="62"   rx="2.2" ry="1.2" fill="none" stroke="#A0B0C0" stroke-width="0.8"/>
  <ellipse cx="36" cy="62"   rx="2.2" ry="1.2" fill="none" stroke="#A0B0C0" stroke-width="0.8"/>

  <!-- Tip — 1 link -->
  <ellipse cx="32" cy="65"   rx="2.0" ry="1.1" fill="none" stroke="#98AAB8" stroke-width="0.7"/>

</svg>
