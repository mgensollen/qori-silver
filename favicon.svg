<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Qori Silver">

  <!-- Warm Andean earth background -->
  <rect width="64" height="64" rx="10" fill="#211510"/>

  <!-- Thin gold ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.35"/>

  <!-- ── LEFT WING ── -->
  <path d="M 27,27 C 22,24 13,23 5,30 C 3,32 2,36 4,39
           C 8,34 14,30 20,28 C 22,27 24,27 27,27 Z"
        fill="#C9A84C"/>
  <!-- Wing secondary — darker inner area -->
  <path d="M 4,39 C 8,34 14,30 19,28.5 C 14,31 9,34 6,38 Z"
        fill="#9E7832"/>

  <!-- ── RIGHT WING ── -->
  <path d="M 37,27 C 42,24 51,23 59,30 C 61,32 62,36 60,39
           C 56,34 50,30 44,28 C 42,27 40,27 37,27 Z"
        fill="#C9A84C"/>
  <path d="M 60,39 C 56,34 50,30 45,28.5 C 50,31 55,34 58,38 Z"
        fill="#9E7832"/>

  <!-- ── BODY = PERU MAP in silver chain ── -->
  <!-- Simplified Peru outline held as the condor's body:
       NW coast → N (Ecuador/Colombia) → NE Amazon bulge
       → SE Bolivia → S Chile coast → W Pacific coast back -->
  <path d="M 29.5,17 L 34,17 L 36.5,22 L 36,28 L 33.5,34
           L 32,36 L 30,34 L 27.5,28 L 27.5,21 Z"
        fill="#1A0D07"
        stroke="#C4CDD8"
        stroke-width="1.5"
        stroke-dasharray="2,1.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Silver dot = Lima (capital, west-central coast) -->
  <circle cx="29.5" cy="25" r="1.3" fill="#C4CDD8"/>

  <!-- ── WHITE RUFF / COLLAR ── -->
  <ellipse cx="32" cy="17.5" rx="4.5" ry="2.2" fill="#F2EBE0" opacity="0.9"/>

  <!-- ── HEAD ── -->
  <ellipse cx="32" cy="12.5" rx="3.8" ry="4.2" fill="#C9A84C"/>

  <!-- Eye -->
  <circle cx="31" cy="11.8" r="1.1" fill="#1A0D07"/>
  <circle cx="31.3" cy="11.5" r="0.42" fill="#E8D080"/>

  <!-- Hooked beak -->
  <path d="M 30.5,15 Q 28.5,17.5 30.5,16.8 Q 32,16.2 33.5,16.8 Q 35.5,17.5 33.5,15 Z"
        fill="#9E7832"/>

  <!-- ── TAIL FEATHERS ── -->
  <path d="M 28.5,36 Q 30,42 32,43.5 Q 34,42 35.5,36"
        fill="#C9A84C" opacity="0.85"/>
  <!-- Feather separators -->
  <line x1="32" y1="37" x2="32" y2="43" stroke="#1A0D07" stroke-width="0.8"/>
  <line x1="30" y1="37" x2="29.2" y2="41.5" stroke="#1A0D07" stroke-width="0.7"/>
  <line x1="34" y1="37" x2="34.8" y2="41.5" stroke="#1A0D07" stroke-width="0.7"/>

</svg>
