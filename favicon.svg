<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Qori Silver">

  <!-- ── BACKGROUND ── -->
  <rect width="64" height="64" rx="6" fill="#1A1410"/>

  <!-- ── LEFT WING — wide angular sweep, feather cuts ── -->
  <path d="M 26,24 L 2,16 L 2,23 L 10,27 L 18,29 L 22,37 L 27,33 Z"
        fill="#E0D8C8"/>
  <line x1="4"  y1="18" x2="14" y2="29" stroke="#1A1410" stroke-width="1.6"/>
  <line x1="10" y1="17" x2="18" y2="29" stroke="#1A1410" stroke-width="1.3"/>

  <!-- ── RIGHT WING ── -->
  <path d="M 38,24 L 62,16 L 62,23 L 54,27 L 46,29 L 42,37 L 37,33 Z"
        fill="#E0D8C8"/>
  <line x1="60" y1="18" x2="50" y2="29" stroke="#1A1410" stroke-width="1.6"/>
  <line x1="54" y1="17" x2="46" y2="29" stroke="#1A1410" stroke-width="1.3"/>

  <!-- ── BODY — central angular torso ── -->
  <path d="M 26,24 L 38,24 L 42,33 L 36,43 L 28,43 L 22,33 Z"
        fill="#E0D8C8"/>

  <!-- ── HEAD — angular polygon, upper-right ── -->
  <path d="M 34,10 L 42,9 L 46,15 L 42,21 L 34,21 L 31,14 Z"
        fill="#E0D8C8"/>

  <!-- Neck bridge -->
  <rect x="33" y="20" width="9" height="5" fill="#E0D8C8"/>

  <!-- ── GOLD CHAIN COLLAR ── key jewelry element, matches necklace product ── -->
  <rect x="32" y="20" width="10" height="5" rx="2" fill="#C9A84C"/>
  <rect x="33.5" y="21" width="7" height="2" rx="1" fill="#D9BA5A" opacity="0.6"/>

  <!-- ── TALONS ── -->
  <path d="M 29,43 L 26,49 L 30,48 L 32,51 L 34,48 L 38,49 L 35,43 Z"
        fill="#E0D8C8"/>

  <!-- ── CHAIN LINKS — cascade below, replacing Paru's grapes ─────────
       Oval rings in a scattered cluster, denser at top, spreading below.
       Mix of sizes suggests depth — closer links larger, further ones smaller.
       ──────────────────────────────────────────────────────────────── -->

  <!-- Row 1 — just below talons, dense -->
  <ellipse cx="25" cy="53" rx="4"   ry="2.2" fill="none" stroke="#BED0DA" stroke-width="1.1"/>
  <ellipse cx="32" cy="52" rx="4.2" ry="2.2" fill="none" stroke="#BED0DA" stroke-width="1.1"/>
  <ellipse cx="39" cy="53" rx="3.8" ry="2.1" fill="none" stroke="#BED0DA" stroke-width="1.1"/>

  <!-- Row 2 — spreading wider -->
  <ellipse cx="20" cy="57" rx="3.2" ry="1.7" fill="none" stroke="#B0C4CE" stroke-width="1.0" opacity="0.85"/>
  <ellipse cx="28" cy="57.5" rx="3.5" ry="1.9" fill="none" stroke="#B0C4CE" stroke-width="1.0"/>
  <ellipse cx="36" cy="57" rx="3.5" ry="1.9" fill="none" stroke="#B0C4CE" stroke-width="1.0"/>
  <ellipse cx="44" cy="57" rx="3"   ry="1.6" fill="none" stroke="#B0C4CE" stroke-width="0.9" opacity="0.75"/>

  <!-- Row 3 — scattering, fading -->
  <ellipse cx="23" cy="61" rx="2.5" ry="1.3" fill="none" stroke="#A0B8C4" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="32" cy="61.5" rx="2.8" ry="1.5" fill="none" stroke="#A0B8C4" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="40" cy="61" rx="2.2" ry="1.2" fill="none" stroke="#A0B8C4" stroke-width="0.7" opacity="0.45"/>

</svg>
